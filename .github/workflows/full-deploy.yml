name: Full Stack Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd frontend/client && npm ci

      - name: Run linting
        run: |
          npm run lint
          cd frontend/client && npm run lint
        continue-on-error: true

      - name: Build frontend
        run: |
          cd frontend/client
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Vercel Token
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "HAS_VERCEL_TOKEN=false" >> $GITHUB_ENV
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "HAS_VERCEL_TOKEN=true" >> $GITHUB_ENV
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: |
          npm ci
          cd frontend/client && npm ci

      - name: Build frontend
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: |
          cd frontend/client
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy Frontend to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend/client
          vercel-args: "--prod"

      - name: Deploy Backend to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"

      - name: No Vercel Token Found
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: |
          echo "::warning title=Deployment Skipped::VERCEL_TOKEN not found in GitHub Secrets. Please add it to your repository settings to enable automated deployment."
